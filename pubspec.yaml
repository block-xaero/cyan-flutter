name: cyan_flutter
description: Cyan - P2P Collaboration Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  zxing2: ^0.2.0  
  flutter_riverpod: ^2.4.9
  ffi: ^2.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  universal_platform: ^1.0.0+1
  flutter_code_editor: ^0.3.0
  highlight: ^0.7.0
  desktop_drop: ^0.4.4
  file_picker: ^6.1.1
  url_launcher: ^6.3.2
  video_player: ^2.11.1

  # The WINDOWS review surface. `video_player` has no Windows implementation at
  # all — the pub cache carries android / avfoundation / web only, and
  # windows/flutter/generated_plugins.cmake registered three plugins with
  # video_player absent — so the review player had no picture on this platform.
  #
  # media_kit is libmpv (ffmpeg) rather than Media Foundation, for two reasons
  # that are requirements and not preferences:
  #   • FRAME ACCURACY — libmpv exposes exact / hr-seek, so "seek to frame N"
  #     lands on frame N. Media Foundation's seek is keyframe-biased.
  #   • THE PLATES — ffmpeg decodes ProRes 422/4444 and DNxHD/HR; Media
  #     Foundation cannot open ProRes at all, so the drop-in alternative would
  #     have played proxies and failed on the very masters the review station
  #     exists for.
  #
  # PINNED, not caret-ranged: a decoder that silently changed seek behaviour
  # would break frame accuracy, which is the one failure this surface must not
  # have.
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: 1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    # The brand mark — the real the-cyan.com icon the login screen and the
    # Windows app icon are both built from (byte-identical to cyan-iOS's
    # CyanBrandMark asset). This directory existed with the artwork in it and
    # was never declared, so nothing could load it.
    - assets/icons/
    # The DEFAULT plugin bundle every group is provisioned with, offline and
    # with zero clicks (lib/models/default_plugins.dart). Mirrors the Mac app,
    # which ships the same signed bytes as a Bundle.main resource. Owned by the
    # Mac session like the engine DLL — never hand-edit, request a restage on
    # COORD.md.
    - assets/plugins/
